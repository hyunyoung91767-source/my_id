<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두더지 잡기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {           /* 테마 변수(기본 = 잔디밭) — 어떤 테마에서도 글자·두더지 대비 유지 */
    --bg1: #a8e063; --bg2: #56ab2f;
    --board: rgba(255,255,255,.18);
    --hole1: #4a2f1b; --hole2: #6b4423;
    --accent: #ffe27a;
    --ovl: rgba(20, 40, 12, .78);
  }
  body[data-theme="desert"] {
    --bg1: #f7d794; --bg2: #cc8e35;
    --board: rgba(120, 70, 20, .25);
    --hole1: #7a4a1c; --hole2: #a06a30;
    --accent: #fff3b0;
    --ovl: rgba(56, 32, 6, .78);
  }
  body[data-theme="space"] {
    --bg1: #2b2e5a; --bg2: #0b0d21;
    --board: rgba(255,255,255,.12);
    --hole1: #14163a; --hole2: #3a3d7a;
    --accent: #9ad8ff;
    --ovl: rgba(5, 7, 22, .82);
  }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background .4s ease;
  }
  h1 {
    color: #fff;
    font-size: clamp(28px, 6vw, 44px);
    text-shadow: 0 3px 8px rgba(0,0,0,.25);
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .score {
    color: #fff;
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 800;
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
    margin-bottom: 18px;
  }
  .hud {
    display: flex;
    flex-wrap: wrap;                 /* 폰 좁은 화면에서 줄바꿈 허용 */
    justify-content: center;
    gap: 12px 22px;
    align-items: center;
    margin-bottom: 18px;
    color: #fff;
    font-weight: 800;
    font-size: clamp(18px, 4.2vw, 28px);
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  /* 입체 게임 버튼: 아래 두께(눌림판) + 누르면 실제로 눌리는 느낌 */
  .btn {
    font: inherit;
    font-weight: 800;
    color: #2f6018;
    background: linear-gradient(180deg, #ffffff, #e9f2e2);
    border: 0;
    border-radius: 999px;
    padding: 12px 34px;
    font-size: clamp(18px, 4vw, 24px);
    cursor: pointer;
    box-shadow: 0 6px 0 #b9cdae, 0 12px 18px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.9);
    transition: transform .08s, box-shadow .08s;
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }
  .btn:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #b9cdae, 0 4px 8px rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.9);
  }
  .btn.primary {
    color: #fff;
    background: linear-gradient(180deg, #ffd76b, #f0a83a);
    box-shadow: 0 6px 0 #b57a17, 0 12px 18px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.55);
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .btn.primary:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #b57a17, 0 4px 8px rgba(0,0,0,.24), inset 0 2px 0 rgba(255,255,255,.55);
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--ovl);      /* 테마와 어울리는 딤 색 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 50;
    opacity: 1;
    transition: opacity .35s ease;      /* 화면 사이 부드러운 페이드 */
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay { overflow-y: auto; padding: 56px 12px 24px; }   /* 폰: 내용이 화면보다 길면 스크롤(테마 버튼 아래부터) */
  @media (max-width: 480px) {
    .overlay { gap: 12px; }
    .overlay .big { font-size: clamp(26px, 8vw, 40px); }
    .themeRow { gap: 5px; }
    .themeBtn { font-size: 14px; padding: 6px 10px; }
    .modeCard { padding: 11px 16px; }
    .btn { padding: 11px 26px; }
  }
  .countNum {
    color: #fff;
    font-size: clamp(90px, 22vw, 180px);
    font-weight: 900;
    text-shadow: 0 6px 24px rgba(0,0,0,.45);
    animation: countPop .95s ease-out;
  }
  @keyframes countPop {
    0% { transform: scale(1.6); opacity: 0; }
    25% { transform: scale(1); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: scale(.8); opacity: 0; }
  }
  .newRecord {
    color: var(--accent);
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 900;
    animation: popScore .5s ease-out 2;
  }
  .hall {
    color: #fff;
    background: rgba(255,255,255,.10);
    border-radius: 14px;
    padding: 10px 22px;
    font-size: clamp(14px, 3.2vw, 18px);
    font-weight: 700;
    line-height: 1.7;
    min-width: 240px;
    text-align: center;
  }
  .hall:empty { display: none; }
  .overlay .big {
    color: #fff;
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 900;
    text-shadow: 0 3px 10px rgba(0,0,0,.4);
  }
  .overlay .sub {
    color: #d9f2c8;
    font-size: clamp(16px, 3.6vw, 22px);
    font-weight: 700;
  }
  .modeRow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  /* 선택 카드: 불투명 입체(뒤가 안 비침 — 눈 편함) · 누르면 눌리고 · 고른 것은 앰버 '눌린' 상태 */
  .modeCard {
    display: flex; flex-direction: column; gap: 4px; align-items: center;
    background: linear-gradient(180deg, #ffffff, #e9efe4);
    border: 0;
    border-radius: 16px; padding: 14px 22px; cursor: pointer; color: #2b3a25;
    box-shadow: 0 6px 0 #b9c6ae, 0 11px 16px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.9);
    transition: transform .08s, box-shadow .08s, background .15s;
    text-shadow: none;
  }
  .modeCard b { color: #24331f; }
  .modeCard small { color: #64735b; }
  .modeCard:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #b9c6ae, 0 4px 8px rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.9);
  }
  .modeCard:has(input:checked) {
    background: linear-gradient(180deg, #ffdf8e, #f2b64a);
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b57a17, 0 4px 8px rgba(0,0,0,.22), inset 0 2px 5px rgba(140,85,10,.35), 0 0 14px rgba(255,215,107,.45);
  }
  .modeCard:has(input:checked) b { color: #5b3d08; }
  .modeCard:has(input:checked) small { color: #7a5512; }
  .modeCard input { position: absolute; opacity: 0; }
  .hidden2 { display: none; }
  /* ── 배경 장면(테마 3종 — 색 전환이 아니라 '풍경') : 이미지 파일 없이 SVG로, 게임판 가독성 유지 ── */
  .bgScene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bgScene .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: none; transform: translateZ(0); }
  body:not([data-theme]) .sc-grass { display: block; }
  body[data-theme="desert"] .sc-desert { display: block; }
  body[data-theme="space"] .sc-space { display: block; }
  .bgScene::after {   /* 상단 은은한 비네트 — 어떤 테마에서도 HUD 흰 글자 또렷하게 */
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.16), rgba(0,0,0,0) 30%);
  }
  h1, .hud, .board { position: relative; z-index: 1; }   /* 콘텐츠는 장면 위로 */
  @keyframes cloudDrift { 0% { transform: translateX(0); } 100% { transform: translateX(70px); } }
  .cloudA { animation: cloudDrift 26s ease-in-out infinite alternate; }
  .cloudB { animation: cloudDrift 34s ease-in-out infinite alternate-reverse; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .twinkA { animation: twinkle 2.6s ease-in-out infinite; }
  .twinkB { animation: twinkle 3.8s ease-in-out 1.2s infinite; }
  @keyframes shoot {
    0%, 82% { transform: translate(0, 0); opacity: 0; }
    84% { opacity: 1; }
    100% { transform: translate(-340px, 190px); opacity: 0; }
  }
  .shootStar { animation: shoot 9s linear infinite; }
  @keyframes heatShimmer { 0%, 100% { opacity: .55; } 50% { opacity: .8; } }
  .sunGlow { animation: heatShimmer 5s ease-in-out infinite; }
  /* ── 망치 커서(일인칭): 게임판 위에서 커서 숨김 + 화면 밖(오른쪽 아래)에서 뻗어 나온 큰 망치 ── */
  .board { cursor: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAE7klEQVR4nOyZW0wcVRjHvzO37e5yLw2NNG1t6j4Y0cY2tPFSacV6CZtUK02MqT7YhNT6ZjTRaqRJTUhq+kD1ARMSjPVSGlNiUgxphe0W6wOlhhhsQwmyQWCXcit7nTOX45mZ7oKAbQd2ZkLCDzZzAQ7f/5zv+853zmFghcPACodb7GU4HPamCFuR7/H6VCD5DMOAqqpwryshJEUAgmvzPFfBRtD8F2OE5Mjjd0LRWKKIYxnIy/HAg3L2pxYIBDtjcVF86Zfmb34DG1gwAu4kroohKAIgMBNPgMctUJWaTtq/9Ero12LPsXgc2i61ayORwxDyAf2hMwIQMJuJbhsCWVagf3A4bessizwPhkKa8UYbCO0Am1gkBsh6pHcw0QyBkfAY9XOiG6c9/991aHh0tgUCxeCYAAaljI40jBumhmFJul87MDU9nbmnf3kHbGKBAKKSf/QRAKPXJ6cmjff3GQEJ49k2AKbBJhaOAEs60jEwMhqGaDSqm4T0gJ01cf7zfwVBEGxigYBcl6u358ZAPc0qRwLBK3wsOqOL0Rw7fU0bOv99Xl5+Mhqd+UNWyKdgE8jML589+vg5XhBe53kOMh+B70dIKH/2owtT4ACmSgksKyewiFMSlgDTjyTJgEVpK1Hxz9catvPgAKYEHGro7cGYHBAxViUs3xWhicHPxCcKvwUHYMEk56+P3fI/URymUeDPzMdaTKjw2OF9j/BN7QPtYCOmBWi0XL/d7d+2roCav0svK9IzMyG7D7+wdbCp/e8esIkll9ODG3rfFyXSKmbcyIgJUZQaL5/YuxtswlQWms+p6g3ugvy8ThfHPilkshIHHM/NCCy7c09t4CZYzLIEaDS84SvmPdw1gWM2uTTjOQ4Egaci2GHW7dpeeezXCFjIsldkNT/0jSdFqBQlZSZFM5OeWg13KlWS+GLbyX1esJCsLCmPnvmrP5mS/VhSpdTd9ErnB1ofSWVkOtHS3Fy9pGTxIGRtTfze97eCKVE+REcCxLkjgaXK3J6RRrCIrPZM658TvS8+WqjQknyvXtRlyj207a2KzYnvrgxlfb287CBejNNv+ppcPPs2DWxwCayenWiWIrxLOPDy553nIYtYsq1SgvveoW4UxLIKemAbcYFoHfVj64dP74IsYomAg+dAIYj4U1i5KUqGCGzEhCApUuuFY09tgixhiQulOVXtK2U5tZvODyW6O/EsdSXqUoLQz/FCeVVd57JLcEsFaNRVbylbw7G/u3jGK3AsKHSDYHQyCdGElErK8he9EDkeCIAMS8RyARonX9tSyQlMG81JzNDtROYf00RFvUw5s+5ypKYWQIUlYNkEM5eLN6YGnvcVhiei2C8pmp3I+EbA0VLcF9vo9XaF4ksqw20RoEFFdO98OPcVusdUaux6GCIYuh6lN2U7NubEukKxLjCJrbvTqbh6kLpN3Nh3Ivp+gHbLMqiAYdHxd59bvwdMYquAr66Ohggo+1WiSnNFaHAMKhJY9BmYxPbzgdOBsUt0+XmEbtsrxghkRCCPiyvvqK3gzLTnyAHHl8FIIyKkTtWtT4sg8NBaj3s0MlFlpi3HTmjqA5FPEFLr6C2h7gMlBWs0N4pGFbHTTDuOHjHVd0Q+znFzrxZ4eZlmo76kRPbXfN03bqYNWyYyK1nxh3yrApxmVYDTrApwmlUBTrPiBfwLAAD//3yemYYAAAAGSURBVAMA5f5xms5ntlMAAAAASUVORK5CYII=) 6 7, pointer; }   /* 커서 = 작은 망치(하드웨어 커서·지연 0) — Ⓑ 대표 확정 26.08.13 */
  .hammer {
    position: fixed;
    left: 0; top: 0;
    width: 0; height: 0;           /* 앵커 = 커서 지점(타격점) — 이동은 transform(GPU 합성·레이아웃 0) */
    pointer-events: none;          /* 망치가 클릭을 가로채지 않게 */
    z-index: 90;
    display: none;
    will-change: transform;
  }
  .hammer.show { display: block; }
  .hammer .aim {              /* 조준점: 망치가 꽂힐 지점 표시(커서 자리) */
    position: absolute;
    left: -14px; top: -14px;
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,.65);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,.25), inset 0 0 6px rgba(255,255,255,.35);
  }
  .hammer .aim::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    margin: -3px 0 0 -3px;
    background: rgba(255,255,255,.85);
    border-radius: 50%;
  }
  .hammer svg {
    position: absolute;
    left: -34px; top: -36px;       /* SVG 안 타격점(34,36)이 커서에 오게 */
    width: clamp(200px, 34vmin, 320px);
    height: auto;
    overflow: visible;
    filter: drop-shadow(-8px 14px 12px rgba(0,0,0,.35));
    transform-origin: 88% 92%;     /* 회전축 = 손잡이 끝(내 손·화면 밖 방향) */
    transform: rotate(58deg);      /* 대기: 헤드가 어깨 위로 들려 있음(커서 오른쪽 위) */
    animation: hammerIdle 2.2s ease-in-out infinite;   /* 들고 있는 손의 미세한 숨결 */
  }
  @keyframes hammerIdle {
    0%, 100% { transform: rotate(58deg) translateY(0); }
    50%      { transform: rotate(55deg) translateY(3px); }
  }
  .hammer.swing svg {
    animation: hammerSwing .34s cubic-bezier(.2, .9, .3, 1) forwards;  /* 빠르게 내리치고 천천히 복귀 */
  }
  @keyframes hammerSwing {
    0%   { transform: rotate(58deg); }
    26%  { transform: rotate(0deg); }     /* 타격 — 헤드 타격면이 커서 지점에 꽂힘 */
    38%  { transform: rotate(5deg); }     /* 반동으로 살짝 튕김 */
    100% { transform: rotate(58deg); }    /* 어깨 위로 복귀 */
  }
  /* 타격 순간: 충격 링 + 게임판 흔들림 */
  .impactRing {
    position: fixed;
    width: 70px; height: 70px;
    margin: -35px 0 0 -35px;
    border: 5px solid rgba(255,255,255,.95);
    border-radius: 50%;
    pointer-events: none;
    z-index: 88;
    animation: ringOut .28s ease-out forwards;
  }
  @keyframes ringOut {
    0%   { transform: scale(.25); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .board.shake { animation: boardShake .16s linear; }
  @keyframes boardShake {
    0% { transform: translate(0,0); }
    25% { transform: translate(3px,2px); }
    50% { transform: translate(-3px,-1px); }
    75% { transform: translate(2px,-2px); }
    100% { transform: translate(0,0); }
  }
  /* 명중 시 망치 끝에서 튀는 별·먼지 */
  .spark {
    position: fixed;
    pointer-events: none;
    z-index: 89;
    font-size: 18px;
    animation: sparkFly .5s ease-out forwards;
  }
  @keyframes sparkFly {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.5); }
  }
  /* 얻은 점수(+1/+5×배수)가 그 자리에서 톡 튀어오르며 사라짐 */
  .floatPt {
    position: fixed;
    pointer-events: none;
    z-index: 91;
    font-size: 26px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 2px 6px rgba(0,0,0,.4);
    animation: floatUp .6s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-46px) scale(1.25); }
  }
  /* 콤보 폭발: 배수가 오르는 순간 화면 가운데서 펑(AI 생성 별 폭발 · screen 블렌드로 빛만) */
  .comboBlast {
    position: fixed;
    left: 50%; top: 36%;
    width: 240px; height: 240px;
    margin: -120px 0 0 -120px;
    pointer-events: none;
    z-index: 91;
    mix-blend-mode: screen;
    animation: blastPop .62s ease-out forwards;
  }
  @keyframes blastPop {
    0% { transform: scale(.3) rotate(-8deg); opacity: 0; }
    22% { transform: scale(1.12) rotate(0deg); opacity: 1; }
    100% { transform: scale(1.55) rotate(6deg); opacity: 0; }
  }
  /* COMBO 표시: 잠깐 크게 */
  .comboBadge {
    position: fixed;
    left: 50%; top: 24%;
    transform: translateX(-50%);
    z-index: 92;
    font-size: clamp(28px, 7vw, 46px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 18px rgba(255,226,122,.9), 0 3px 8px rgba(0,0,0,.4);
    pointer-events: none;
    animation: comboPop .7s ease-out forwards;
  }
  @keyframes comboPop {
    0% { opacity: 0; transform: translateX(-50%) scale(.6); }
    25% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 2.5vw, 18px);
    width: min(92vw, 480px);
    background: var(--board);
    border-radius: 24px;
    padding: clamp(14px, 3vw, 24px);
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    transition: background .4s ease;
  }
  .hole {
    aspect-ratio: 1 / 1;
    background: radial-gradient(ellipse at 50% 70%, var(--hole1) 55%, var(--hole2) 100%);
    border-radius: 50%;
    box-shadow: inset 0 8px 14px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.25);
    position: relative;
    overflow: hidden;
  }
  body[data-theme="desert"] .hole { border-radius: 34% 34% 46% 46%; }  /* 구멍 모양도 테마별 */
  body[data-theme="space"] .hole { border-radius: 24%; box-shadow: inset 0 8px 14px rgba(0,0,0,.6), 0 0 12px rgba(154,216,255,.35); }
  .themeRow { display: flex; gap: 8px; position: fixed; left: 14px; top: 14px; z-index: 60; }  /* 좌상단 고정 — 어느 화면에서든 즉시 전환·오버레이 내용과 겹침 0 */
  .themeBtn {
    font: inherit; font-size: 17px; font-weight: 800;
    border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #f4f7f1, #d9e2d2);   /* 불투명 — 뒤가 안 비침 */
    color: #3a4733;
    padding: 7px 15px; cursor: pointer;
    box-shadow: 0 4px 0 #a9b89e, 0 7px 11px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.85);
    transition: transform .08s, box-shadow .08s;
  }
  .themeBtn:active { transform: translateY(4px); box-shadow: 0 0 0 #a9b89e, 0 2px 5px rgba(0,0,0,.2); }
  .themeBtn.on {
    background: linear-gradient(180deg, #ffdf8e, #f2b64a);   /* 선택 = 앰버 눌린 상태(시작 버튼 계열) */
    color: #5b3d08;
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b57a17, 0 3px 6px rgba(0,0,0,.2), inset 0 2px 4px rgba(140,85,10,.3);
  }
  .mole {
    position: absolute;
    left: 50%;
    bottom: -80%;
    transform: translateX(-50%);
    width: clamp(62px, 15vw, 104px);
    height: clamp(62px, 15vw, 104px);
    line-height: 1;
    transition: bottom .18s ease-out;
    user-select: none;
  }
  .mole img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .hole.up .mole { bottom: 12%; }
  /* '퍽' 타격 효과: 살짝 커졌다 사라짐 + 색 변화 */
  @keyframes whack {
    0%   { transform: translateX(-50%) scale(1); filter: none; }
    35%  { transform: translateX(-50%) scale(1.35); filter: brightness(1.6) hue-rotate(-30deg); }
    100% { transform: translateX(-50%) scale(.2); opacity: 0; }
  }
  .hole.hit .mole { animation: whack .28s ease-out forwards; }
  /* 점수가 '톡' 튀는 효과 */
  @keyframes popScore {
    0% { transform: scale(1); }
    45% { transform: scale(1.45); color: #ffe27a; }
    100% { transform: scale(1); }
  }
  .score.bump { animation: popScore .3s ease-out; }
  .board, .hole { touch-action: manipulation; }  /* 모바일 더블탭 확대 방지 — 터치로도 잘 잡히게 */
</style>

  const KINDS = {
    normal: { img: MOLE_IMGS.normal, rate: .78, point: 1 },
    gold:   { img: MOLE_IMGS.gold, rate: .10, point: 5 },   // 약 10%
    bomb:   { img: MOLE_IMGS.bomb, rate: .12, point: -1 },  // 과하지 않게
  };
  let score = 0;
  let hits = 0;                  // 잡은 마리 수(마릿수제 정산·최고기록·자랑 카드 기준 — 점수와 분리)
  let timeLeft = GAME_SEC;
  let playing = false;
  let mode = 'time';           // 'time'(시간제) | 'count'(마릿수제)
  let molesLeft = COUNT_TOTAL; // 마릿수제: 남은 두더지
  let countdownTimer = null;   // 카운트다운 setInterval 핸들 (항상 하나만)
  let moleTimer = null;        // 두더지 등장 setTimeout 핸들

  const scoreVal = document.getElementById('scoreVal');
  const timeVal = document.getElementById('timeVal');
  const bestVal = document.getElementById('bestVal');
  const timeBox = document.getElementById('timeBox');
  const leftBox = document.getElementById('leftBox');
  const leftVal = document.getElementById('leftVal');
  const leftTotal = document.getElementById('leftTotal');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const finalScore = document.getElementById('finalScore');
  const overTitle = document.getElementById('overTitle');
  const resultDetail = document.getElementById('resultDetail');
  const bestMsg = document.getElementById('bestMsg');

  // 최고 점수: 방식별로 따로 저장(localStorage)
  function bestKey() { return mode === 'time' ? 'mole_best_time' : 'mole_best_count'; }
  function loadBest() { return Number(localStorage.getItem(bestKey()) || 0); }
  bestVal.textContent = loadBest();

  // ── 두더지 등장 루프 (종류: 일반/황금/폭탄 — 폭탄은 '잡을 두더지' 수에 안 셈) ──
  function pickKind() {
    const r = Math.random();
    if (r < KINDS.bomb.rate) return 'bomb';
    if (r < KINDS.bomb.rate + KINDS.gold.rate) return 'gold';
    return 'normal';
  }
  function popMole() {
    if (!playing) return;
    if (mode === 'count' && molesLeft <= 0) { endGame(); return; }
    let idx;
    do { idx = Math.floor(Math.random() * holes.length); } while (idx === lastIdx);
    lastIdx = idx;
    const hole = holes[idx];
    const kind = pickKind();
    hole.dataset.kind = kind;
    hole.querySelector('.mole img').src = KINDS[kind].img;
    if (mode === 'count' && kind !== 'bomb') {   // 폭탄은 30마리에 포함하지 않음
      molesLeft -= 1;
      leftVal.textContent = molesLeft;
    }
    hole.classList.add('up');
    const stay = kind === 'gold' ? Math.round(curStay() * .65) : curStay();  // 황금은 더 빨리 사라짐 · 콤보 가속 반영
    moleTimer = setTimeout(() => {
      hole.classList.remove('up');
      if (kind !== 'bomb') {                     // 일반·황금을 시간 내 못 잡고 놓침
        combo = 0; prevMult = 1;                 // ★콤보 끊김 조건 ② (폭탄은 피해도 콤보 유지)
        resetSpeed();                            // 끊기면 속도도 기본으로 — 숨 고르기
      }
      if (!playing) return;
      if (mode === 'count' && molesLeft <= 0) { moleTimer = setTimeout(endGame, 350); return; }
      moleTimer = setTimeout(popMole, curRest());
    }, stay);
  }
  // 콤보 상태 + 표시 (끊김 = ①폭탄 누름 ②잡을 두더지 놓침, 두 경우만)

  function comboBlast() {           // AI 생성 별 폭발 — 콤보 단계 상승 순간 펑
    const b = document.createElement('img');
    b.src = COMBO_IMG;
    b.className = 'comboBlast';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 680);
  }
  // 콤보 가속: 콤보 3 누적마다 한 단계 빨라짐 — 잘할수록 스릴, 끊기면 속도도 리셋
  let speedLv = 0;
  const SPEED_STEP = 3;      // 콤보 3마다 +1단계
  const SPEED_RATE = 0.92;   // 단계당 8%씩 빨라짐(조금씩)
  const SPEED_MAX = 6;       // 최대 6단계 ≈ 기본의 0.61배 — 너무 어렵지 않게
  function curStay() { return Math.round(STAY_MS * Math.pow(SPEED_RATE, speedLv)); }
  function curRest() { return Math.round(REST_MS * Math.pow(SPEED_RATE, speedLv)); }
  function comboSpeedUp() {          // 잡기 성공 직후 호출 — 단계 상승 시 ⚡ 표시
    const lv = Math.min(SPEED_MAX, Math.floor(combo / SPEED_STEP));
    if (lv > speedLv) {
      speedLv = lv;
      showCombo('⚡ 더 빨라진다!');
    }
  }
  function resetSpeed() { speedLv = 0; }
  function showCombo(txt) {
    const c = document.createElement('div');
    c.className = 'comboBadge';
    c.textContent = txt;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 720);
  }
  function floatPoint(x, y, txt) {
    const f = document.createElement('span');
    f.className = 'floatPt';
    f.textContent = txt;
    f.style.left = (x - 12) + 'px';
    f.style.top = (y - 30) + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 640);
  }

  // ── 잡기: 구멍 칸 전체 인정 + '퍽' 타격 효과 ──
  const scoreBox = document.querySelector('.score');
  holes.forEach(hole => {
    hole.addEventListener('pointerdown', (e) => {
      if (!playing || !hole.classList.contains('up')) return;
      const kind = hole.dataset.kind || 'normal';
      hole.classList.remove('up');
      clearTimeout(moleTimer);                         // ★잡았으면 만료 타이머 정리(잡은 것을 '놓침'으로 이중 처리 방지)
      moleTimer = setTimeout(popMole, curRest());      // 다음 두더지는 한 박자 뒤(콤보 가속 반영)
      hole.classList.add('hit');                       // 살짝 커졌다 사라지는 퍽 효과
      setTimeout(() => hole.classList.remove('hit'), 300);
      if (kind === 'bomb') {                           // 폭탄: 누르면 -1점 + ★콤보 초기화(끊김 조건 ①) — 승부는 점수로
        score = Math.max(0, score - 1);
        scoreVal.textContent = score;
        combo = 0; prevMult = 1;
        resetSpeed();                                  // 끊기면 속도도 기본으로
        sfxEnd();
        return;
      }
      // 콤보: 일반·황금 연속 잡기 → 배수 x2(3연속)·x3(6연속) + 3마다 속도 한 단계 상승
      hits += 1;
      combo += 1;
      comboSpeedUp();
      const mult = combo >= 6 ? 3 : combo >= 3 ? 2 : 1;
      if (mult > prevMult) comboBlast();               // x2·x3에 처음 오르는 순간 — 별 폭발
      prevMult = mult;
      const gained = KINDS[kind].point * mult;
      score += gained;
      scoreVal.textContent = score;
      floatPoint(e.clientX, e.clientY, '+' + gained);
      if (mult > 1) showCombo('COMBO x' + mult + '!');
      scoreBox.classList.remove('bump');               // 점수 톡 튀기(연타에도 재발동)
      void scoreBox.offsetWidth;
      scoreBox.classList.add('bump');
      sparkBurst(e.clientX, e.clientY);                // 명중 — 망치 끝에서 별·먼지
      sfxWhack();                                      // 뿅/팡 타격음
    });
  });

  // ── 게임 시작 / 종료 ──
  function clearTimers() {
    clearInterval(countdownTimer);
    clearTimeout(moleTimer);
    countdownTimer = null;
    moleTimer = null;
  }
  // 3·2·1 카운트다운 화면 → 곧바로 시작 (화면 전환마다 타이머 전부 정리)
  const countOverlay = document.getElementById('countOverlay');
  const countNum = document.getElementById('countNum');
  let count321 = null;
  function beginCountdown() {
    clearTimers(); stopBGM(); clearInterval(count321);   // 이전 카운트다운·BGM·두더지 타이머 정리
    playing = false;
    holes.forEach(h => h.classList.remove('up'));
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    countOverlay.classList.remove('hidden');
    let n = 3;
    function showN() {
      countNum.textContent = n;
      countNum.style.animation = 'none';
      void countNum.offsetWidth;
      countNum.style.animation = '';
      sfxTick();
    }
    showN();
    count321 = setInterval(() => {
      n -= 1;
      if (n <= 0) {
        clearInterval(count321); count321 = null;
        countOverlay.classList.add('hidden');
        startGame();                                     // 곧바로 시작
      } else showN();
    }, 950);
  }
  function refreshTitleBest() {
    document.getElementById('titleBestTime').textContent = Number(localStorage.getItem('mole_best_time') || 0);
    document.getElementById('titleBestCount').textContent = Number(localStorage.getItem('mole_best_count') || 0);
  }
  function showTitle() {
    clearTimers(); stopBGM(); clearInterval(count321);   // 화면 전환마다 타이머 정리
    playing = false;
    holes.forEach(h => h.classList.remove('up'));
    refreshTitleBest();
    overOverlay.classList.add('hidden');
    countOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  }
  function startGame() {
    clearTimers();                       // ★이전 타이머를 반드시 정리하고 시작(겹침 방지 — 난이도 변경 재시작 포함)
    holes.forEach(h => h.classList.remove('up'));
    mode = document.querySelector('input[name="mode"]:checked').value;
    diff = document.querySelector('input[name="diff"]:checked').value;
    localStorage.setItem('mole_diff', diff);          // 고른 난이도 기억
    STAY_MS = DIFFS[diff].stay;
    REST_MS = DIFFS[diff].rest;
    COUNT_TOTAL = DIFFS[diff].count;
    score = 0; hits = 0; timeLeft = GAME_SEC; molesLeft = COUNT_TOTAL;
    combo = 0; speedLv = 0; prevMult = 1;
    scoreVal.textContent = 0;
    timeVal.textContent = timeLeft;
    leftVal.textContent = molesLeft;
    leftTotal.textContent = COUNT_TOTAL;
    // HUD: 방식에 맞는 표시만
    timeBox.classList.toggle('hidden2', mode === 'count');
    leftBox.classList.toggle('hidden2', mode !== 'count');
    bestVal.textContent = loadBest();
    playing = true;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    popMole();
    startBGM();                          // BGM: 잔잔하게 반복
    if (mode === 'time') {               // ★마릿수제일 때는 30초 카운트다운이 돌지 않게
      countdownTimer = setInterval(() => {
        timeLeft -= 1;
        timeVal.textContent = timeLeft;
        if (timeLeft <= 5 && timeLeft > 0) sfxTick();   // 카운트다운 신호음(마지막 5초)
        if (timeLeft <= 0) endGame();
      }, 1000);
    }
  }
  function endGame() {
    playing = false;
    clearTimers();
    stopBGM();
    sfxEnd();                            // 게임 종료 신호음
    holes.forEach(h => h.classList.remove('up'));
    finalScore.textContent = score;
    if (mode === 'count') {
      const pct = Math.round(hits / COUNT_TOTAL * 100);
      overTitle.innerHTML = COUNT_TOTAL + '마리 중 <span id="finalScore">' + hits + '</span>마리 명중!';
      resultDetail.textContent = '명중률 ' + pct + '%';
    } else {
      overTitle.innerHTML = '점수 <span id="finalScore">' + score + '</span>점!';
      resultDetail.textContent = '';
    }
    const best = loadBest();
    const rec = mode === 'count' ? hits : score;     // 마릿수제 최고기록 = 잡은 마리 수
    const bUnit = mode === 'count' ? '마리' : '점';
    if (rec > best) {
      localStorage.setItem(bestKey(), rec);
      bestMsg.innerHTML = '<span class="newRecord">🎉 신기록!</span> 이전 최고 ' + best + bUnit;
    } else {
      bestMsg.textContent = '최고 기록 ' + best + bUnit;
    }
    bestVal.textContent = loadBest();
    // 게임오버 화면: 방식 전환 버튼 라벨(무엇으로 시작되는지) + 난이도 현재값 동기화
    swapBtn.textContent = (mode === 'time' ? '마릿수제' : '시간제') + '로 다시';
    const od = document.querySelector('input[name="overDiff"][value="' + diff + '"]');
    if (od) od.checked = true;
    // Top 5 진입이면 닉네임 입력 노출
    if (score > 0 && hallRank(score)) {
      pendingScore = score;
      document.getElementById('nickInput').value = '';
      document.getElementById('nickRow').classList.remove('hidden2');
    } else {
      document.getElementById('nickRow').classList.add('hidden2');
    }
    drawHalls();
    overOverlay.classList.remove('hidden');
  }

  const swapBtn = document.getElementById('swapBtn');
  // 게임오버 화면에서 고른 난이도를 본 라디오에 반영(다시/전환 공통)
  function applyOverDiff() {
    const v = document.querySelector('input[name="overDiff"]:checked').value;
    const r = document.querySelector('input[name="diff"][value="' + v + '"]');
    if (r) r.checked = true;
  }
  document.getElementById('startBtn').addEventListener('click', beginCountdown);
  document.getElementById('againBtn').addEventListener('click', () => {
    applyOverDiff();                      // 난이도 바꿔 '다시 하기'도 가능
    beginCountdown();                     // 3·2·1 → 시작(안에서 타이머 전부 정리)
  });
  // ★방식 바꿔서 다시: 시간제 ↔ 마릿수제 반대로 곧바로 시작
  swapBtn.addEventListener('click', () => {
    const next = (mode === 'time') ? 'count' : 'time';
    const r = document.querySelector('input[name="mode"][value="' + next + '"]');
    if (r) r.checked = true;
    applyOverDiff();
    beginCountdown();
  });
  document.getElementById('titleBtn').addEventListener('click', showTitle);
  refreshTitleBest();                     // 타이틀: 최고 점수 표시

  // ── Top 5 명예의 전당(localStorage — 서버·로그인 없음) ──
  const HALL_KEY = 'mole_hall';
  function loadHall() { try { return JSON.parse(localStorage.getItem(HALL_KEY) || '[]'); } catch (e) { return []; } }
  function hallHTML() {
    const h = loadHall();
    if (!h.length) return '';
    return '🏅 명예의 전당 Top 5<br>' + h.map((r, i) =>
      ['🥇','🥈','🥉','4.','5.'][i] + ' ' + r.name + ' — ' + r.score + '점').join('<br>');
  }
  function drawHalls() {
    document.getElementById('titleHall').innerHTML = hallHTML();
    document.getElementById('overHall').innerHTML = hallHTML();
  }
  function hallRank(sc) {          // Top5 진입 순위(0-base) 또는 -1
    const h = loadHall();
    if (h.length < 5) return true;
    return h.some(r => sc > r.score);
  }
  let pendingScore = null;
  document.getElementById('nickSaveBtn').addEventListener('click', () => {
    const name = (document.getElementById('nickInput').value || '').trim() || '무명';
    const h = loadHall();
    h.push({ name, score: pendingScore });
    h.sort((a, b) => b.score - a.score);
    localStorage.setItem(HALL_KEY, JSON.stringify(h.slice(0, 5)));
    pendingScore = null;
    document.getElementById('nickRow').classList.add('hidden2');
    drawHalls();
    toast('명예의 전당에 올렸어요!');
  });
  drawHalls();

  // ── 자랑하기: canvas로 결과 카드 PNG 생성 — PC=다운로드 · 폰=공유 시트 ──
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.style.display = 'none'; }, 2600);
  }
  const MOLE_CARD_IMG = new Image();
  MOLE_CARD_IMG.src = MOLE_IMGS.normal;
  function makeCard() {            // 화면 캡처가 아니라 코드로 그려서 생성
    const cv = document.createElement('canvas');
    cv.width = 720; cv.height = 480;
    const c = cv.getContext('2d');
    const g = c.createLinearGradient(0, 0, 0, 480);
    g.addColorStop(0, '#a8e063'); g.addColorStop(1, '#56ab2f');
    c.fillStyle = g; c.fillRect(0, 0, 720, 480);
    c.fillStyle = 'rgba(255,255,255,.22)';
    c.beginPath(); c.roundRect(40, 40, 640, 400, 28); c.fill();
    c.textAlign = 'center';
    c.font = '900 54px "Segoe UI", "Malgun Gothic", sans-serif';
    c.fillStyle = '#fff';
    c.fillText('두더지 잡기', 360, 130);
    if (MOLE_CARD_IMG.complete && MOLE_CARD_IMG.naturalWidth > 0) {
      c.drawImage(MOLE_CARD_IMG, 300, 150, 120, 120);
    } else {
      c.font = '110px serif';
      c.fillText('🐭', 360, 250);
    }
    c.font = '900 46px "Segoe UI", "Malgun Gothic", sans-serif';
    c.fillStyle = '#ffe27a';
    const unit = mode === 'count' ? '마리' : '점';
    const shown = mode === 'count' ? hits : score;   // 마릿수제 = 잡은 마리 수
    c.fillText(shown + unit + '! 도전해봐 🐭', 360, 330);
    c.font = '700 24px "Segoe UI", "Malgun Gothic", sans-serif';
    c.fillStyle = '#eaf7df';
    const d = new Date();
    c.fillText(d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate()
      + ' · ' + (mode === 'count' ? '마릿수제' : '시간제') + ' · ' + DIFFS[diff].label, 360, 390);
    return cv;
  }
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const cv = makeCard();
    const isMobile = matchMedia('(hover: none) and (pointer: coarse)').matches;
    cv.toBlob(async blob => {
      const file = new File([blob], '두더지잡기_결과.png', { type: 'image/png' });
      if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {                                          // 휴대폰: 공유 시트
          await navigator.share({ files: [file], title: '두더지 잡기', text: '두더지 잡기 ' + score + '점! 도전해봐 🐭' });
          toast('공유했어요!');
          return;
        } catch (e) { /* 공유 취소 시 다운로드로 */ }
      }
      const a = document.createElement('a');           // PC: 공유창 말고 바로 다운로드
      a.href = URL.createObjectURL(blob);
      a.download = '두더지잡기_결과.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      toast('저장했어요 — 다운로드 폴더 확인');
    }, 'image/png');
  });

  // ── 테마 3종: 즉시 전환·선택 기억(localStorage) ──
  const themeBtns = document.querySelectorAll('.themeBtn');
  function setTheme(name) {
    if (name === 'grass') document.body.removeAttribute('data-theme');
    else document.body.dataset.theme = name;
    themeBtns.forEach(b => b.classList.toggle('on', b.dataset.theme === name));
    localStorage.setItem('mole_theme', name);
  }
  themeBtns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
  setTheme(localStorage.getItem('mole_theme') || 'grass');

  // 저장된 난이도 복원(localStorage)
  (function restoreDiff() {
    const saved = localStorage.getItem('mole_diff');
    if (saved && DIFFS[saved]) {
      const r = document.querySelector('input[name="diff"][value="' + saved + '"]');
      if (r) r.checked = true;
    }
  })();

  // ── 소리(Web Audio 코드 합성 — 파일·다운로드·라이선스 불필요) ──
  let audioCtx = null;
  let soundOn = localStorage.getItem('mole_sound') !== 'off';   // 음소거 상태 기억
  let bgmTimer = null;
  const soundBtn = document.getElementById('soundBtn');
  function drawSoundBtn() { soundBtn.textContent = soundOn ? '🔊' : '🔇'; }
  drawSoundBtn();
  function ctx() {
    // 모바일 자동재생 정책: 첫 사용자 입력(터치·클릭) 후에만 AudioContext 생성/재개
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type, vol, when) {
    if (!soundOn) return;
    const ac = ctx();
    const t0 = ac.currentTime + (when || 0);
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, t0);           // 볼륨은 낮게
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  const sfxWhack = () => { beep(660, .09, 'square', .09); beep(880, .07, 'square', .07, .04); };  // 뿅/팡 타격음
  function sfxSwing() {          // 망치 '휙' — 주파수가 훅 떨어지는 스윙 바람 소리
    if (!soundOn) return;
    const ac = ctx();
    const t0 = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(720, t0);
    o.frequency.exponentialRampToValueAtTime(140, t0 + .11);
    g.gain.setValueAtTime(.035, t0);
    g.gain.exponentialRampToValueAtTime(.001, t0 + .12);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + .14);
  }
  const sfxTick  = () => beep(1200, .05, 'sine', .05);                                            // 카운트다운 신호음
  const sfxEnd   = () => { beep(520, .18, 'triangle', .09); beep(390, .22, 'triangle', .09, .12); }; // 종료 신호음
  // BGM: 한 음 반복이 아니라 '짧고 경쾌한 리듬+멜로디 루프'(약 6.4초) — 게임 시작에 흐르고 게임오버에 멈춤
  const BGM_MELODY = [   // [주파수(0=쉼표), 길이(스텝)] — 경쾌한 8마디 루프
    [392,1],[440,1],[494,1],[587,1],[494,1],[440,1],[392,2],
    [330,1],[392,1],[440,1],[523,1],[440,1],[392,1],[330,2],
    [392,1],[440,1],[494,1],[587,1],[659,1],[587,1],[494,2],
    [523,1],[494,1],[440,1],[392,1],[330,1],[294,1],[392,2],
  ];
  const BGM_BASS = [131, 165, 196, 165];   // 마디 베이스
  function startBGM() {
    stopBGM();
    if (!soundOn) return;
    let step = 0, mi = 0;
    function tickStep() {
      // 남은 시간이 얼마 안 남으면(시간제 5초 이하) 살짝 빨라져 긴박하게
      const hurry = (mode === 'time' && playing && timeLeft <= 5);
      const stepMs = hurry ? 145 : 200;
      const [f, len] = BGM_MELODY[mi % BGM_MELODY.length];
      if (step === 0 || step % 4 === 0) beep(BGM_BASS[Math.floor(mi / 7) % 4], .18, 'triangle', .022);  // 리듬(베이스)
      if (f) beep(f, .16 * len, 'square', hurry ? .03 : .024);                                          // 멜로디
      mi++; step++;
      bgmTimer = setTimeout(tickStep, stepMs * len);
    }
    tickStep();
  }
  function stopBGM() { clearTimeout(bgmTimer); bgmTimer = null; }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    localStorage.setItem('mole_sound', soundOn ? 'on' : 'off');
    drawSoundBtn();
    if (!soundOn) stopBGM(); else if (playing) startBGM();
  });

  // ── 망치 커서(일인칭): 화면 밖에서 뻗어 나온 큰 망치 — 어깨 축 스윙 ──
  const board = document.querySelector('.board');
  const hammer = document.createElement('div');
  hammer.className = 'hammer';
  hammer.innerHTML = `
  <div class="aim"></div>
  <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hmSteel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eef2f6"/><stop offset=".45" stop-color="#aab4bf"/>
        <stop offset=".55" stop-color="#8b96a2"/><stop offset="1" stop-color="#5c6670"/>
      </linearGradient>
      <linearGradient id="hmWood" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c98d4b"/><stop offset=".5" stop-color="#a86a2e"/>
        <stop offset="1" stop-color="#7c4a1d"/>
      </linearGradient>
      <linearGradient id="hmFace" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f5f8fb"/><stop offset="1" stop-color="#c3ccd5"/>
      </linearGradient>
    </defs>
    <!-- 손잡이: 헤드에서 오른쪽 아래(내 손 방향·화면 밖)로 -->
    <g>
      <rect x="60" y="46" width="196" height="24" rx="12" fill="url(#hmWood)"
            transform="rotate(49 72 58)"/>
      <rect x="196" y="42" width="52" height="30" rx="14" fill="#6b3f18"
            transform="rotate(49 72 58)" opacity=".9"/>
    </g>
    <!-- 헤드: 가로 원통 — 왼쪽 끝이 타격면(커서 지점) -->
    <g>
      <rect x="28" y="14" width="86" height="46" rx="14" fill="url(#hmSteel)"/>
      <rect x="30" y="18" width="80" height="10" rx="5" fill="rgba(255,255,255,.55)"/>
      <ellipse cx="34" cy="37" rx="10" ry="22" fill="url(#hmFace)"/>
      <ellipse cx="110" cy="37" rx="9" ry="21" fill="#4c565f"/>
    </g>
  </svg>`;
  document.body.appendChild(hammer);
  const hammerSvg = hammer.querySelector('svg');
  const FINE_POINTER = matchMedia('(hover: hover) and (pointer: fine)').matches; // 마우스 환경 판별

  function swingHammer(x, y) {
    // 스윙 재발동(연타 대응) — 애니메이션 리셋
    hammer.classList.remove('swing');
    void hammerSvg.offsetWidth;
    hammer.classList.add('swing');
    sfxSwing();
    // 타격 시점(스윙의 26% ≈ 88ms)에 충격 링 + 게임판 흔들림
    setTimeout(() => {
      const ring = document.createElement('div');
      ring.className = 'impactRing';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 300);
      board.classList.remove('shake');
      void board.offsetWidth;
      board.classList.add('shake');
    }, 88);
    setTimeout(() => hammer.classList.remove('swing'), 360);
  }

  if (FINE_POINTER) {
    // 커서 자체가 망치(위 .board cursor) — 큰 망치는 클릭 순간에만 그 자리에 나타나 내리침(지연 0 구조 · Ⓑ)
    board.addEventListener('pointerdown', e => {
      hammer.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
      hammer.classList.add('show');
      swingHammer(e.clientX, e.clientY);
      setTimeout(() => hammer.classList.remove('show'), 420);
    });
  } else {
    // 폰(터치): 누른 자리에 망치가 나타나 내리치고 사라짐
    board.addEventListener('pointerdown', e => {
      hammer.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
      hammer.classList.add('show');
      swingHammer(e.clientX, e.clientY);
      setTimeout(() => hammer.classList.remove('show'), 420);
    });
  }
  // 명중 시 망치 끝에서 작은 별·먼지 튀기
  function sparkBurst(x, y) {
    const emo = ['✨', '⭐', '💥', '🌟'];
    for (let i = 0; i < 5; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = emo[i % emo.length];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px');
      s.style.setProperty('--dy', (-30 - Math.random() * 60) + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 520);
    }
  }
</script>
</body>
</html>
